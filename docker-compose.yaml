services:
  neo4j:
    image: neo4j:latest
    container_name: route-planner-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: none
    volumes:
      - neo4j/data:/data
      - neo4j/logs:/logs
      - neo4j/import:/import

volumes:
  neo4j_data:
  neo4j_logs:
